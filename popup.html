<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeRead Clipper</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 420px;
      margin: 0;
      color: #24312b;
      background: #f6f8f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { padding: 18px 20px; color: #fff; background: #07c160; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    header p { margin: 0; font-size: 12px; opacity: 0.9; }
    main { padding: 16px 20px 20px; }
    .status {
      padding: 12px;
      border: 1px solid #dfe7e3;
      border-radius: 8px;
      background: #fff;
      font-size: 13px;
      line-height: 1.6;
    }
    .status.error { color: #b42318; border-color: #f4c7c3; background: #fff6f5; }
    .status.success { color: #067a3e; border-color: #b7e5ca; background: #f3fff7; }
    progress { width: 100%; height: 8px; margin-top: 10px; accent-color: #07c160; }
    .meta { margin: 12px 0; color: #66736e; font-size: 12px; line-height: 1.7; }
    textarea {
      width: 100%;
      height: 220px;
      padding: 10px;
      resize: vertical;
      border: 1px solid #dfe7e3;
      border-radius: 8px;
      background: #fff;
      color: #24312b;
      font-size: 12px;
      line-height: 1.7;
    }
    .actions { display: grid; gap: 8px; margin-top: 12px; }
    button {
      padding: 11px 14px;
      border: 1px solid #dfe7e3;
      border-radius: 8px;
      background: #fff;
      color: #24312b;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary { border-color: #07c160; color: #fff; background: #07c160; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    .secondary-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .hint { margin: 12px 0 0; color: #87938e; font-size: 11px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>📖 WeRead Clipper</h1>
    <p>视觉截屏 · 本地 OCR · 自动去重拼接</p>
  </header>
  <main>
    <section id="status" class="status">正在读取任务状态…</section>
    <progress id="progress" max="1" value="0"></progress>
    <div id="meta" class="meta"></div>
    <textarea id="result" placeholder="提取完成后，章节文本会显示在这里" readonly></textarea>
    <div class="actions">
      <button id="start" class="primary">开始提取当前章节</button>
      <div class="secondary-actions">
        <button id="copy" disabled>复制文本</button>
        <button id="preview" disabled>页面预览</button>
        <button id="export" disabled>导出 TXT</button>
      </div>
    </div>
    <p class="hint">识别完全在本地完成。提取期间请保持微信读书标签页位于当前窗口前台。</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
