<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeRead Clipper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f7f7f7;
      color: #333;
    }

    .header {
      background: #07c160;
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .header .logo {
      font-size: 22px;
    }

    .status {
      padding: 12px 20px;
      font-size: 13px;
      color: #888;
      border-bottom: 1px solid #e8e8e8;
    }

    .status.error {
      color: #e74c3c;
      background: #fef0ef;
    }

    .status.success {
      color: #07c160;
      background: #f0faf4;
    }

    .info {
      padding: 12px 20px;
      border-bottom: 1px solid #e8e8e8;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13px;
    }

    .info-row .label {
      color: #888;
    }

    .info-row .value {
      color: #333;
      font-weight: 500;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #07c160;
      color: #fff;
    }

    .btn-primary:hover {
      background: #06ad56;
    }

    .btn-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
    }

    .btn-secondary:disabled {
      color: #ccc;
      cursor: not-allowed;
    }

    .preview {
      padding: 12px 20px;
      max-height: 150px;
      overflow: hidden;
    }

    .preview-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .preview-text {
      font-size: 12px;
      line-height: 1.6;
      color: #666;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      background: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #eee;
    }

    .footer {
      padding: 8px 20px;
      text-align: center;
      font-size: 11px;
      color: #bbb;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #888;
      font-size: 13px;
      gap: 8px;
    }

    .loading-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .loading-log {
      width: 100%;
      max-height: 180px;
      overflow: auto;
      padding: 10px 12px;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      background: #fff;
      color: #666;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ddd;
      border-top-color: #07c160;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">📖</span>
    <h1>WeRead Clipper</h1>
  </div>

  <div id="loading" class="loading">
    <div class="loading-main">
      <div class="spinner"></div>
      <span id="loadingText">popup.html 已加载，等待 popup.js...</span>
    </div>
    <pre id="loadingLog" class="loading-log">[popup-html v2026.03.29.2] 已渲染，等待脚本启动…</pre>
  </div>

  <div id="content" style="display:none;">
    <div id="status" class="status"></div>

    <div id="info" class="info">
      <div class="info-row">
        <span class="label">📚 书籍</span>
        <span class="value" id="bookName">-</span>
      </div>
      <div class="info-row">
        <span class="label">📑 章节</span>
        <span class="value" id="chapterName">-</span>
      </div>
      <div class="info-row">
        <span class="label">📊 字数</span>
        <span class="value" id="charCount">0</span>
      </div>
    </div>

    <div id="preview" class="preview">
      <div class="preview-label">预览</div>
      <div class="preview-text" id="previewText"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="btnCopy" disabled>
        📋 复制全部文本
      </button>
      <button class="btn btn-secondary" id="btnPreview" disabled>
        👁️ 页面内预览
      </button>
    </div>

    <div class="footer">
      WeRead Clipper v1.1 · 微信读书文本复制工具
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
